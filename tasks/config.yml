---

- name: Start squid services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: yes
  become: yes
  loop: "{{ squid_services }}"

- name: Create custom configuration
  ansible.builtin.template:
    src: "{{ squid_conf_template }}"
    dest: "{{ squid_conf }}"
    owner: root
    group: "{{ squid_group }}"
    mode: "0640"
  notify: Restart squid
